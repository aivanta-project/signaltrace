[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signaltrace"
version = "0.1.0-alpha.1"
description = "Cryptographic provenance and verifiable execution traces for autonomous AI systems"
readme = "README.md"
authors = [{ name = "Aivanta Contributors", email = "engineering@aivanta.org" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai-agents", "provenance", "cryptography", "auditability", "merkle-dag", "trace-verification"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
signaltrace = "signaltrace.cli:main"

[project.urls]
Homepage = "https://aivanta-project.github.io/aivanta-project/projects/signaltrace/"
Repository = "https://github.com/aivanta-project/signaltrace"
Issues = "https://github.com/aivanta-project/signaltrace/issues"
Organization = "https://github.com/aivanta-project"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
